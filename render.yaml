services:
  - type: web
    name: crms
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CRMS_SECRET
        generateValue: true
      - key: CRMS_DB_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: CRMS_ADMIN_EMAIL
        sync: false
      - key: CRMS_ADMIN_PASSWORD
        sync: false
      # e-mail for password resets and alerts; leave them blank to run without e-mail
      - key: CRMS_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
