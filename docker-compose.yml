# Local development databases. The passwords are for this machine only.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crms
      POSTGRES_PASSWORD: crms
      POSTGRES_DB: crms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: crms
      MYSQL_USER: crms
      MYSQL_PASSWORD: crms
      MYSQL_DATABASE: crms
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mongo-data:
  postgres-data:
  mysql-data:
