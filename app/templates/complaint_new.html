{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>File a complaint</h1><p>The station reviews every complaint before a case is opened.</p></div></div>
<form class="panel form-narrow" method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="field"><label for="title">Short title</label><input id="title" name="title" maxlength="120" value="{{ form.get('title', '') }}" required></div>
  <div class="field"><label for="description">What happened</label><textarea id="description" name="description" required>{{ form.get('description', '') }}</textarea></div>
  <div class="row">
    <div class="field"><label for="location">Where</label><input id="location" name="location" maxlength="200" value="{{ form.get('location', '') }}" required></div>
    <div class="field"><label for="incident_date">Date of incident</label><input id="incident_date" name="incident_date" type="date" value="{{ form.get('incident_date', '') }}" required></div>
  </div>
  <div class="row" style="margin-top: var(--space-md)">
    <button class="btn btn--primary" type="submit">Submit complaint</button>
    <a class="btn" href="{{ url_for('complaints.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
